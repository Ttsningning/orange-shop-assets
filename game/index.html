<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小暖光酒馆</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Layout: game HUD around a 16:9 tavern stage — nav rail left, goals/orders right, dish bar + start button below. Single warm lamplit look by choice. */
:root{
  --night:#1d130b;
  --wood:#6b4423; --wood-d:#4a2d16; --wood-hi:#9a6534;
  --parch:#f7ecd3; --parch-2:#efdcb4; --line:#c99b55;
  --ink:#4a2e17; --ink-soft:#7d5a35;
  --leaf:#5f7d44; --leaf-d:#3f5a2e;
  --orange:#e7782b; --brick:#b5502b; --cream:#fdf6e6; --danger:#c2462e;
  --display:"ZCOOL KuaiLe","Noto Serif SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Serif SC","Songti SC","STSong","PingFang SC",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--night) radial-gradient(ellipse at 50% 0%,#3f2814 0%,var(--night) 65%) fixed;color:var(--cream);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.game{max-width:1320px;margin:0 auto;display:grid;gap:12px;
  grid-template-columns:92px minmax(0,1fr) 300px;
  grid-template-areas:"head head head" "nav stage side" "nav talk side" "dish dish start"}
@media (max-width:1000px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "talk" "dish" "start" "nav" "side"}
}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.logo h1{margin:0;font:400 clamp(26px,4.2vw,40px)/1.1 var(--display);color:var(--parch);letter-spacing:.04em;text-shadow:0 3px 0 #2a170a,0 0 18px #ffb45a44}
.logo h1 em{font-style:normal;color:#ffc07a}
.logo span{font-size:13px;letter-spacing:.5em;color:#e9cf9c;padding-left:2.2em;position:relative}
.logo span::before{content:"";position:absolute;left:0;top:50%;width:1.6em;border-top:1px solid #e9cf9c88}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--parch);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #2a170a99;white-space:nowrap}
.chip img{width:22px;height:22px;object-fit:contain}
.chip .sep{width:1px;align-self:stretch;background:var(--line)}
.gear{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--wood) url(img/gear.webp) center/26px no-repeat;cursor:pointer;box-shadow:0 3px 0 #2a170a99}

/* ---------- nav rail ---------- */
.nav{grid-area:nav;display:flex;flex-direction:column;gap:8px;background:linear-gradient(var(--leaf),var(--leaf-d));border:3px solid var(--line);border-radius:16px;padding:10px 8px;align-self:start;box-shadow:inset 0 0 0 2px #ffffff14,0 6px 18px #0008}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;border:2px solid transparent;background:none;color:var(--cream);font:700 15px/1 var(--body);letter-spacing:.1em;cursor:pointer}
.tab img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 2px #0007)}
.tab[aria-selected="true"]{background:var(--parch);color:var(--ink);border-color:#e8c27a;box-shadow:0 0 0 3px #f3c46a55}
@media (max-width:1000px){
  .nav{flex-direction:row;padding:6px;border-radius:14px}
  .tab{flex:1;flex-direction:row;justify-content:center;font-size:14px;padding:8px 4px}
  .tab img{width:26px;height:26px}
}

/* ---------- stage ---------- */
.stage{grid-area:stage;position:relative;aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;border-radius:16px;border:3px solid var(--line);box-shadow:0 10px 40px #000a;background:#2b1c10;user-select:none;-webkit-user-select:none}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s{position:absolute;height:auto;pointer-events:none;-webkit-user-drag:none}
.hit{position:absolute;padding:0;border:0;background:none;cursor:pointer}
.hit img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.glow{position:absolute;inset:0;pointer-events:none;z-index:50;background:radial-gradient(circle at 70% 30%,#ffb45a26,transparent 40%),radial-gradient(circle at 25% 20%,#ffb45a1c,transparent 32%),linear-gradient(transparent 70%,#1d130b55);mix-blend-mode:screen;animation:flick 4s ease-in-out infinite}
@keyframes flick{50%{opacity:.75}}
.decor{animation:arrive .6s ease-out}
.guest{transition:opacity .5s,transform .5s;animation:arrive .6s ease-out}
.guest.leave{opacity:0;transform:translateY(-4%)}
@keyframes arrive{from{opacity:0;transform:translateY(6%)}}
.bub{position:absolute;left:50%;bottom:96%;width:12cqw;aspect-ratio:504/343;transform:translateX(-50%);background:url(img/speech_bubble.webp) center/100% 100% no-repeat;display:grid;place-items:center;padding-bottom:22%;filter:drop-shadow(0 .3cqw .4cqw #0008);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bub img{width:56%;height:auto}
.bub .fav{position:absolute;top:-8%;right:-6%;width:30%}
.bub.cooking img:first-child{opacity:.45}
.bub.done{background:none;filter:none}
.bub.done img{width:70%;animation:beat .6s ease-in-out infinite alternate}
.bub .gone{font:400 2.4cqw/1 var(--display);color:var(--ink);margin-bottom:30%}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}}
@keyframes beat{to{transform:scale(1.15)}}
.pat{position:absolute;left:18%;right:18%;top:calc(100% - 4px);height:max(4px,.7cqw);background:#0008;border-radius:99px;overflow:hidden;border:1px solid #fff4}
.pat i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.pat i.mid{background:var(--orange)}.pat i.low{background:var(--danger)}
.cookbub{position:absolute;width:6cqw;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--orange) var(--p,0%),#0007 0);display:grid;place-items:center;border:.25cqw solid var(--line);z-index:61;pointer-events:none;box-shadow:0 .3cqw .8cqw #0009}
.cookbub img{width:76%;height:76%;object-fit:contain;background:var(--parch);border-radius:50%;padding:8%}
.say{position:absolute;z-index:62;pointer-events:none;background:var(--cream);color:var(--ink);font:700 clamp(9px,1.25cqw,14px)/1.3 var(--body);padding:.6em .9em;border-radius:1.2em;border:2px solid var(--line);white-space:nowrap;box-shadow:0 .3cqw .6cqw #0007;transform:translateX(-50%)}
.say::after{content:"";position:absolute;left:30%;bottom:-.55em;width:.9em;height:.9em;background:var(--cream);border:2px solid var(--line);border-top:0;border-left:0;transform:rotate(45deg)}
.toast{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:75;background:var(--parch);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:.5em 1.2em;font:400 clamp(12px,1.8cqw,20px)/1.2 var(--display);box-shadow:0 .4cqw 1cqw #0009;animation:toast 2.6s ease forwards;white-space:nowrap;display:flex;gap:.4em;align-items:center}
.toast img{width:1.3em}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.float{position:absolute;z-index:80;pointer-events:none;font:400 clamp(13px,2.4cqw,26px)/1 var(--display);color:#ffd27a;text-shadow:0 2px 0 #000a,0 0 6px #000;animation:rise 1.3s ease-out forwards;display:flex;align-items:center;gap:.2em;transform:translateX(-50%)}
.float img{width:1.2em}
.float.bad{color:#ff9c86}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.catcd{position:absolute;right:6%;top:-6%;width:3.4cqw;aspect-ratio:1;border-radius:50%;background:conic-gradient(#0009 var(--p,0%),transparent 0),url(img/paw.webp) center/80% no-repeat,var(--parch);border:2px solid var(--line);pointer-events:none}
.closed{position:absolute;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:linear-gradient(#1d130b00,#1d130b66)}
.closed span{font:400 clamp(16px,3.2cqw,34px)/1 var(--display);color:var(--parch);text-shadow:0 3px 0 #2a170a,0 0 20px #000;letter-spacing:.12em}
@container (max-width:620px){.bub{width:17cqw}.cookbub{width:9cqw}.catcd{width:6cqw}.say{font-size:9px}}

/* ---------- dialog ---------- */
.talk{grid-area:talk;display:grid;grid-template-columns:clamp(84px,18%,140px) minmax(0,1fr);gap:14px;align-items:stretch;background:var(--parch);color:var(--ink);border-radius:14px;padding:10px 16px 10px 10px;border:3px solid var(--line);box-shadow:inset 0 0 0 3px var(--parch),inset 0 0 0 4px #c99b5566,0 6px 18px #0008;min-height:118px}
.portrait{position:relative;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff6e0,#e8d3a6);border:2px solid var(--line);min-height:96px}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.speech{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.who{align-self:flex-start;font:400 16px/1 var(--display);color:var(--cream);background:var(--wood);padding:5px 12px 4px;border-radius:6px;border:2px solid var(--line);letter-spacing:.1em}
.speech p{margin:0;font-size:16px;line-height:1.7;overflow-wrap:anywhere;text-wrap:pretty}

/* ---------- side panels ---------- */
.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--parch);color:var(--ink);border:3px solid var(--line);border-radius:16px;box-shadow:inset 0 0 0 3px var(--parch),inset 0 0 0 4px #c99b5566,0 6px 18px #0008;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;text-align:center;font:900 18px/1.2 var(--body);letter-spacing:.14em;color:var(--wood-d);display:flex;align-items:center;justify-content:center;gap:8px}
.card h2::before,.card h2::after{content:"";width:22px;height:12px;background:var(--leaf);border-radius:0 100% 0 100%;opacity:.85}
.card h2::after{transform:scaleX(-1)}
.goal{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:6px;align-items:center;background:#fffaf0;border:1px solid #e0c48e;border-radius:12px;padding:10px 12px}
.goal>img{grid-row:1/3;width:44px;height:40px;object-fit:contain}
.goal b{font-size:14.5px;font-weight:700}
.goal .num{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;grid-row:2;grid-column:3}
.goal .track{grid-column:2;height:9px;border-radius:99px;background:#e6d7b8;overflow:hidden;box-shadow:inset 0 1px 2px #0002}
.goal .track i{display:block;height:100%;background:linear-gradient(var(--leaf),var(--leaf-d));border-radius:99px;transition:width .3s}
.goal .rew{grid-row:1;grid-column:3;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:2px}
.goal .rew img{width:14px;height:14px}
.goal.done{background:#eef3e2;border-color:#a9bf86}
.goal.done b::after{content:" ✓";color:var(--leaf)}
.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ord{background:#fffaf0;border:1px solid #e0c48e;border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ord img{width:64px;height:52px;object-fit:contain}
.ord span{font-size:13px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;font-size:13.5px;color:var(--ink-soft);padding:14px 6px;line-height:1.6;margin:0}
.gbtn{border:2px solid #2f4622;background:linear-gradient(#7ea05a,var(--leaf-d));color:var(--cream);font:900 16px/1 var(--body);letter-spacing:.2em;padding:11px;border-radius:12px;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff40,0 3px 0 #2a3a1d}
.gbtn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed}
.item{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fffaf0;border:1px solid #e0c48e;border-radius:12px;padding:8px 10px}
.item>img{width:50px;height:46px;object-fit:contain}
.item b{font-size:14.5px;display:block}
.item small{font-size:12.5px;color:var(--ink-soft);line-height:1.5;display:block}
.buy{border:2px solid var(--line);background:linear-gradient(var(--wood-hi),var(--wood));color:var(--cream);font:700 14px/1 var(--body);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.buy img{width:16px}
.buy:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.owned{font-size:13px;color:var(--leaf-d);font-weight:700;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.pal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;background:#fffaf0;border:1px solid #e0c48e;border-radius:12px;padding:8px 10px}
.pal>img{width:64px;height:60px;object-fit:contain}
.pal b{font-size:15px}
.pal small{display:block;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.pal.locked>img{filter:grayscale(.6);opacity:.7}
.note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0;line-height:1.6}

/* ---------- dish bar ---------- */
.dishbar{grid-area:dish;background:linear-gradient(var(--wood),var(--wood-d));border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin;box-shadow:inset 0 2px 0 #ffffff1a,0 6px 18px #0008;min-width:0}
.dish{position:relative;flex:1 0 190px;display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--parch);color:var(--ink);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .2s;margin-top:6px}
.dish>img{width:86px;height:66px;object-fit:contain;filter:drop-shadow(0 3px 3px #0003)}
.dish .n{font:900 16px/1.25 var(--body);display:block}
.dish .p{display:flex;align-items:center;gap:4px;font:700 16px/1 var(--body);color:var(--ink-soft);margin-top:8px;font-variant-numeric:tabular-nums}
.dish .p img{width:20px}
.dish:active{transform:scale(.97)}
.dish.want{border-color:var(--orange);box-shadow:0 0 0 3px #e7782b66,0 0 16px #e7782b99}
.dish .cnt{position:absolute;top:-8px;right:-4px;min-width:26px;height:24px;border-radius:99px;background:var(--orange);color:#fff;font:400 14px/22px var(--display);text-align:center;border:2px solid var(--cream);padding:0 5px}
@media (max-width:560px){.chip{font-size:13px;padding:5px 9px;gap:6px}.chip img{width:18px;height:18px}.gear{width:38px;height:38px;background-size:22px}.bar{gap:6px}}
@media (max-width:1000px){.dish{flex-basis:160px;grid-template-columns:62px minmax(0,1fr)}.dish>img{width:62px;height:50px}.dish .n{font-size:14px}}

/* ---------- start ---------- */
.start{grid-area:start;display:flex}
.startbtn{flex:1;position:relative;border:3px solid #e8b36a;border-radius:18px;background:linear-gradient(#cf6a36,var(--brick));color:var(--cream);font:400 clamp(26px,3vw,36px)/1 var(--display);letter-spacing:.14em;cursor:pointer;box-shadow:inset 0 0 0 3px #00000022,inset 0 2px 0 #ffffff40,0 5px 0 #6b2a12,0 10px 24px #000a;padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px}
.startbtn small{font:700 13px/1 var(--body);letter-spacing:.1em;color:#ffe2c4}
.startbtn:disabled{background:linear-gradient(#8a6a44,#6b4f30);border-color:var(--line);cursor:default;box-shadow:inset 0 0 0 3px #00000022,0 5px 0 #3a2814}
.startbtn .bell{position:absolute;left:12px;bottom:10px;width:34px;opacity:.9}
.startbtn .nap{position:absolute;right:16px;top:-20px;width:62px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;background:#140c06d0;display:grid;place-items:center;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{width:min(540px,100%);animation:fadein .3s}
.mcard h2{font:400 clamp(24px,5vw,32px)/1.2 var(--display);letter-spacing:.08em}
.mcard h2::before,.mcard h2::after{display:none}
.lead{margin:0;text-align:center;line-height:1.8;font-size:15px}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:150px}
.duo img{height:100%;width:auto}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:440px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{background:#fffaf0;border:1px solid #e0c48e;border-radius:10px;padding:8px 6px;text-align:center}
.sum b{display:block;font:400 22px/1.2 var(--display);color:var(--wood);font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--ink-soft)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ghost{border:2px solid var(--line);background:none;color:var(--wood);font:700 14px/1 var(--body);padding:9px 14px;border-radius:10px;cursor:pointer}
.big{border:3px solid #e8b36a;background:linear-gradient(#cf6a36,var(--brick));color:var(--cream);font:400 20px/1 var(--display);letter-spacing:.12em;padding:13px 24px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #6b2a12}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffaf0;border:1px solid #e0c48e;border-radius:12px;padding:10px 12px;font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="game">
  <header class="head">
    <div class="logo"><h1><em>小暖光</em>酒馆</h1><span>把日子酿成甜的</span></div>
    <div class="bar">
      <div class="chip"><span id="dayLbl">第 1 天 · 周一</span><span class="sep"></span><span id="clock">18:00</span></div>
      <div class="chip"><img src="img/orange_coin.webp" alt="橘子币"><span id="coins">0</span></div>
      <div class="chip"><img src="img/heart.webp" alt=""><span>人气 <span id="rep">0</span></span></div>
      <div class="chip"><img src="img/star.webp" alt=""><span>Lv. <span id="lv">1</span></span></div>
      <button class="gear" id="gearBtn" type="button" aria-label="设置"></button>
    </div>
  </header>

  <nav class="nav" role="tablist" aria-label="酒馆">
    <button class="tab" role="tab" data-tab="shop" aria-selected="true" type="button"><img src="img/icon_lantern.webp" alt="">营业</button>
    <button class="tab" role="tab" data-tab="menu" aria-selected="false" type="button"><img src="img/menu_book.webp" alt="">菜单</button>
    <button class="tab" role="tab" data-tab="decor" aria-selected="false" type="button"><img src="img/icon_plant.webp" alt="">装饰</button>
    <button class="tab" role="tab" data-tab="pals" aria-selected="false" type="button"><img src="img/fox_bunny_avatar.webp" alt="">伙伴</button>
  </nav>

  <div class="stage" id="stage">
    <img class="bg" src="img/bg.jpg" alt="雨夜里的小暖光酒馆">
    <div id="layer"></div>
    <div class="glow"></div>
    <div class="closed" id="closed"><span>今日未营业</span></div>
  </div>

  <section class="talk" aria-live="polite">
    <div class="portrait"><img id="pImg" src="img/lady_half_smile.webp" alt=""></div>
    <div class="speech"><span class="who" id="pName">宁宁</span><p id="pText">欢迎来到小暖光酒馆！</p></div>
  </section>

  <aside class="side" id="side"></aside>

  <div class="dishbar" id="dishes" aria-label="菜品"></div>

  <div class="start"><button class="startbtn" id="startBtn" type="button"><img class="bell" src="img/service_bell.webp" alt=""><img class="nap" src="img/cat_sleep.webp" alt=""><span id="startTxt">开始营业</span><small id="startSub">第 1 天</small></button></div>
</div>

<div class="modal" id="modal" hidden><div class="card mcard" id="mcard"></div></div>
<audio id="bgm" src="audio/tavern.mp3" loop preload="none"></audio>

<script>
(() => {
const $ = id => document.getElementById(id);
const IMG = n => `img/${n}.webp`;
const pick = a => a[Math.floor(Math.random()*a.length)];
const WEEK = '一二三四五六日';

/* ================= data ================= */
const DISH = {
  orange_tea:{n:'热橙茶',price:8,cook:1.6},
  egg_sandwich:{n:'鸡蛋三明治',price:10,cook:2},
  hot_cocoa:{n:'热可可',price:9,cook:1.8},
  mushroom_soup:{n:'蘑菇浓汤',price:12,cook:2.4},
  apple_soda:{n:'苹果气泡饮',price:11,cook:1.6,cost:30},
  caramel_pudding:{n:'焦糖布丁',price:13,cook:2.2,cost:45},
  pumpkin_soup:{n:'南瓜浓汤',price:14,cook:2.6,cost:60},
  baked_rice:{n:'芝士焗饭',price:16,cook:3,cost:75},
  strawberry_cake:{n:'草莓蛋糕',price:17,cook:2.6,cost:90},
  berry_pancakes:{n:'莓果松饼',price:18,cook:2.8,cost:110},
  roast_chicken:{n:'烤鸡腿配土豆',price:22,cook:3.4,cost:140},
  grilled_fish:{n:'蜂蜜烤鱼',price:24,cook:3.6,cost:170},
};
const GUEST = {
  bear:{n:'熊大叔',fav:'roast_chicken',
    order:['来份{d}，要热乎的！','走了一天山路，给我{d}。','今天想吃{d}，橘子老板手艺最好。'],
    happy:['好吃！明天还来。','香！这下有力气回家了。'],favLine:'就是这个味道！橘子的手艺没话说。'},
  deer:{n:'鹿小姐',fav:'apple_soda',
    order:['请给我一份{d}，谢谢～','雨好大呀，想要{d}。','宁宁，今天的{d}还有吗？'],
    happy:['谢谢宁宁，很好吃。','暖和多了，雨声也变好听了。'],favLine:'是苹果气泡饮！今天运气真好。'},
  rabbit:{n:'兔小姐',fav:'strawberry_cake',
    order:['我要{d}！','能来一份{d}吗？','嗯……就{d}吧！'],
    happy:['甜甜的，好幸福。','下次带朋友一起来。'],favLine:'草莓蛋糕！我可以再坐一会儿吗？'},
  raccoon:{n:'浣熊先生',fav:'grilled_fish',
    order:['一份{d}，麻烦快一点。','听说这里的{d}不错。','{d}，谢谢。'],
    happy:['嗯，名不虚传。','值这个价，小费收下吧。'],favLine:'蜂蜜烤鱼的火候刚刚好，佩服。'},
};
const DECOR = {
  plant:{n:'盆栽绿植',img:'plant_potted',d:'屋里多点绿意，客人多等 2 秒。',cost:40},
  rug:{n:'绿色地毯',img:'rug_green',d:'踩上去软软的，满意的客人多给 1 点人气。',cost:60},
  tree:{n:'橘子树',img:'orange_tree',d:'小费多 5%。',cost:80},
  board:{n:'今日特供小黑板',img:'chalkboard_sign',d:'路过的客人被吸引进来，客人来得更勤。',cost:100},
  table:{n:'第三张桌子',img:'round_table',d:'多一个座位，能同时招待三位客人。',cost:150},
};
const KITCHEN = [80,160,280];
const PALS = {
  guoguo:{n:'果果',img:'dog_sweater_sit',d:'穿毛衣的比熊，在门口迎客。每单小费多 15%。',cost:160},
  tangtang:{n:'糖糖',img:'dog_stretch',d:'爱伸懒腰的比熊，陪客人玩。所有客人多等 15%。',cost:220},
};
const SEATS = [{x:3,b:9},{x:21,b:2},{x:37,b:11}];
const START = ['orange_tea','egg_sandwich','hot_cocoa','mushroom_soup'];
const DAY_LEN = 100;
const KEY = 'xiao-nuan-guang-v1';
const fresh = () => ({coins:20,rep:3,day:1,served:0,unlocked:[...START],decor:{},cookLv:0,pals:{},bgm:true,seen:false});

let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)||'null')||{}); } catch(e){ S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const R = {open:false,t:0,seats:[],queue:[],spawnIn:1.2,stats:{earn:0,served:0,lost:0},catCd:0,combo:0,uid:0,goals:[],tab:'shop'};
const lv = () => 1 + Math.floor(Math.sqrt(S.served/6));

/* ================= scene ================= */
const layer = $('layer'), stage = $('stage');
function spr(name,{l,b,w,z=1},cls){
  const im = document.createElement('img');
  im.className='s'+(cls?' '+cls:''); im.src=IMG(name); im.alt=''; im.draggable=false;
  Object.assign(im.style,{left:l+'%',bottom:b+'%',width:w+'%',zIndex:z});
  layer.appendChild(im); return im;
}
function hitSpr(name,{l,b,w,z},label,fn){
  const btn = document.createElement('button');
  btn.className='hit'; btn.type='button'; btn.setAttribute('aria-label',label);
  Object.assign(btn.style,{left:l+'%',bottom:b+'%',width:w+'%',zIndex:z});
  btn.innerHTML=`<img src="${IMG(name)}" alt="">`;
  btn.addEventListener('click',fn); layer.appendChild(btn); return btn;
}
const E = {};
function buildScene(){
  layer.innerHTML='';
  spr('rug_oval',{l:1,b:0,w:44,z:1});
  E.rug = spr('rug_green',{l:54,b:3,w:30,z:1},'decor');
  spr('fireplace',{l:37,b:40.5,w:14,z:2});
  spr('shelf_bottles',{l:68,b:41,w:13,z:2});
  E.tree = spr('orange_tree',{l:.5,b:32,w:10,z:3},'decor');
  E.plant = spr('plant_potted',{l:92.5,b:31,w:6.5,z:3},'decor');
  E.board = spr('chalkboard_sign',{l:85.5,b:33,w:6.5,z:3},'decor');
  E.boss = spr('chibi_boss_smile',{l:57,b:38,w:12,z:4});
  E.lady = spr('chibi_lady_smile',{l:72.5,b:38,w:12,z:4});
  spr('counter',{l:54,b:19,w:33,z:5});
  spr('lantern',{l:56,b:48,w:3,z:6});
  spr('orange_basket',{l:81.5,b:43,w:5.5,z:6});
  E.tangtang = hitSpr('dog_stretch',{l:42.5,b:27,w:9,z:8},'糖糖',()=>{ swap(E.tangtang,'dog_run',1500,'dog_stretch'); say('lady','laugh','糖糖又在伸懒腰，客人们看着都不着急了。'); });
  E.guoguo = hitSpr('dog_sweater_sit',{l:35,b:28,w:7.5,z:8},'果果',()=>{ swap(E.guoguo,'dog_sweater_lie',1600,'dog_sweater_sit'); say('lady','smile','果果今天也穿着小毛衣迎客，大家都多给了小费。'); });
  E.seats = SEATS.map((s,i)=>{
    const z = 20 + (20 - s.b);
    const chair = spr('chair_front',{l:s.x,b:s.b+2,w:7.5,z});
    const table = spr('round_table',{l:s.x+7,b:s.b-2,w:11,z:z+2});
    const slot = document.createElement('div');
    Object.assign(slot.style,{position:'absolute',left:(s.x-0.6)+'%',bottom:(s.b-1)+'%',width:'8.7%',zIndex:z+1});
    layer.appendChild(slot);
    return {chair,table,slot};
  });
  spr('pet_bed_back_cushion',{l:80,b:1.5,w:17,z:40});
  E.cat = hitSpr('cat_sleep',{l:82.5,b:5.5,w:11.5,z:41},'摸摸罐罐',petCat);
  E.cat.insertAdjacentHTML('beforeend','<span class="catcd" hidden></span>');
  spr('pet_bed_front_rim',{l:80.8,b:1,w:15.4,z:42});
  E.catSay = document.createElement('div'); E.catSay.className='say';
  Object.assign(E.catSay.style,{left:'86%',bottom:'22%'});
  E.catSay.textContent='本店支持摸猫抵小费';
  layer.appendChild(E.catSay);
  E.cook = document.createElement('div'); E.cook.className='cookbub'; E.cook.hidden=true;
  Object.assign(E.cook.style,{left:'64%',bottom:'62%'}); E.cook.innerHTML='<img alt="">';
  layer.appendChild(E.cook);
  applyOwned();
}
const tables = () => S.decor.table ? 3 : 2;
function applyOwned(){
  E.rug.hidden=!S.decor.rug; E.tree.hidden=!S.decor.tree; E.plant.hidden=!S.decor.plant; E.board.hidden=!S.decor.board;
  E.guoguo.hidden=!S.pals.guoguo; E.tangtang.hidden=!S.pals.tangtang;
  E.seats.forEach((s,i)=>{ const show=i<tables(); s.chair.hidden=s.table.hidden=!show; });
}
const tmr = new WeakMap();
function swap(el,name,ms,back){
  const im = el.tagName==='IMG'?el:el.querySelector('img');
  im.dataset.k=''; im.src = IMG(name); clearTimeout(tmr.get(el));
  if(ms) tmr.set(el,setTimeout(()=>{ im.src=IMG(back); },ms));
}
const BOSS = {idle:'chibi_boss_smile',busy:'chibi_boss_laugh_tray',mad:'chibi_boss_arms_crossed_pout'};
const LADY = {idle:'chibi_lady_smile',wave:'chibi_lady_wave',sad:'chibi_lady_sad'};

/* ================= dialog / feedback ================= */
const NAMES = {boss:'橘子',lady:'宁宁'};
function say(who,expr,text){
  const img=$('pImg');
  const src = GUEST[who] ? IMG(who+'_half') : IMG(`${who}_half_${expr}`);
  if(!img.src.endsWith(src)){ img.src=src; img.style.animation='none'; void img.offsetWidth; img.style.animation=''; }
  $('pName').textContent = GUEST[who] ? GUEST[who].n : NAMES[who];
  $('pText').textContent = text;
}
function toast(html){
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=html; stage.appendChild(t); setTimeout(()=>t.remove(),2700);
}
function floatAt(el,html,bad){
  const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect();
  const f=document.createElement('div'); f.className='float'+(bad?' bad':''); f.innerHTML=html;
  f.style.left=((r.left+r.width/2-s.left)/s.width*100)+'%';
  f.style.top=((r.top-s.top)/s.height*100-6)+'%';
  stage.appendChild(f); setTimeout(()=>f.remove(),1400);
}

/* ================= HUD ================= */
function hud(){
  $('coins').textContent = S.coins.toLocaleString('zh-CN');
  $('rep').textContent = S.rep;
  $('lv').textContent = lv();
  $('dayLbl').textContent = `第 ${S.day} 天 · 周${WEEK[(S.day-1)%7]}`;
  const frac = R.open ? Math.min(R.t/DAY_LEN,1) : 0;
  const mins = 18*60 + Math.floor(frac*360);
  $('clock').textContent = R.open && mins>=1440 ? '打烊中' : `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`;
  $('startBtn').disabled = R.open;
  $('startTxt').textContent = R.open ? '营业中' : '开始营业';
  $('startSub').textContent = R.open ? `还有 ${Math.max(0,Math.ceil(DAY_LEN-R.t))} 秒打烊` : `第 ${S.day} 天 · 周${WEEK[(S.day-1)%7]}`;
  $('closed').hidden = R.open;
  E.catSay.hidden = R.open && R.catCd>0;
}

/* ================= dishes ================= */
function buildDishes(){
  const box=$('dishes'); box.innerHTML='';
  S.unlocked.forEach(id=>{
    const d=DISH[id];
    const b=document.createElement('button'); b.type='button'; b.className='dish'; b.id='dish-'+id;
    b.innerHTML=`<img src="${IMG(id)}" alt=""><span><span class="n">${d.n}</span><span class="p"><img src="${IMG('orange_coin')}" alt="">${d.price}</span></span>`;
    b.addEventListener('click',()=>order(id));
    box.appendChild(b);
  });
  refresh();
}
function wants(){ const w={}; R.seats.forEach(g=>{ if(g&&g.state==='wait') w[g.dish]=(w[g.dish]||0)+1; }); return w; }
function refresh(){
  const w=wants();
  S.unlocked.forEach(id=>{
    const b=$('dish-'+id); if(!b) return;
    b.classList.toggle('want',!!w[id]);
    let c=b.querySelector('.cnt');
    if(w[id]){ if(!c){c=document.createElement('span');c.className='cnt';b.appendChild(c);} c.textContent='×'+w[id]; } else if(c) c.remove();
  });
  if(R.tab==='shop') renderTab();
}

/* ================= side panels ================= */
function goalHTML(g){
  const pct=Math.min(g.have/g.need,1)*100;
  return `<div class="goal ${g.have>=g.need?'done':''}"><img src="${IMG(g.img)}" alt=""><b>${g.text}</b><span class="rew"><img src="${IMG('orange_coin')}" alt="">+${g.reward}</span><span class="track"><i style="width:${pct}%"></i></span><span class="num">${Math.min(g.have,g.need)}/${g.need}</span></div>`;
}
function renderShopTab(){
  const w=wants(), ids=Object.keys(w), queued=R.queue.map(j=>DISH[j.dish].n);
  $('side').innerHTML = `
    <section class="card"><h2>今晚的小目标</h2>${R.goals.length?R.goals.map(goalHTML).join(''):'<p class="empty">开始营业后，宁宁会写下今晚的小目标。</p>'}</section>
    <section class="card"><h2>客人订单</h2>
      <div class="orders">${ids.length?ids.slice(0,4).map(id=>`<div class="ord"><img src="${IMG(id)}" alt=""><span>${DISH[id].n} ×${w[id]}</span></div>`).join(''):`<p class="empty">${R.open?'暂时没有新的点单，罐罐在打呼噜。':'开始营业后，客人的点单会出现在这里。'}</p>`}</div>
      ${queued.length?`<p class="note">灶台上：${queued.join('、')}</p>`:''}
      <button class="gbtn" id="makeBtn" type="button" ${ids.length&&R.open?'':'disabled'}>开始制作</button>
      <p class="note">点下方的菜品，也能直接做给点了它的客人。</p>
    </section>`;
  $('makeBtn').addEventListener('click',()=>{
    const g=R.seats.filter(g=>g&&g.state==='wait').sort((a,b)=>a.pat-b.pat)[0];
    if(g) order(g.dish);
  });
}
const costBtn = (k,cost) => `<button class="buy" type="button" data-buy="${k}" ${S.coins<cost?'disabled':''}><img src="${IMG('orange_coin')}" alt="">${cost}</button>`;
function renderMenuTab(){
  const rows = Object.entries(DISH).map(([id,d])=>{
    const fan=Object.values(GUEST).find(G=>G.fav===id);
    const have=S.unlocked.includes(id);
    return `<div class="item"><img src="${IMG(id)}" alt=""><div><b>${d.n}</b><small>售价 ${d.price} · 制作 ${(d.cook*Math.pow(.8,S.cookLv)).toFixed(1)} 秒${fan?` · ${fan.n}的最爱`:''}</small></div>${have?'<span class="owned">在菜单上</span>':costBtn('dish:'+id,d.cost)}</div>`;
  }).join('');
  $('side').innerHTML = `<section class="card"><h2>菜单</h2><div class="list">${rows}</div><p class="note">客人吃到最爱的菜，会多给小费和人气。</p></section>`;
}
function renderDecorTab(){
  const rows = Object.entries(DECOR).map(([k,it])=>`<div class="item"><img src="${IMG(it.img)}" alt=""><div><b>${it.n}</b><small>${it.d}</small></div>${S.decor[k]?'<span class="owned">已摆好</span>':costBtn('decor:'+k,it.cost)}</div>`).join('');
  const kl=S.cookLv;
  const kitchen = `<div class="item"><img src="${IMG('fireplace')}" alt=""><div><b>灶台升级${kl<3?` Lv${kl+1}`:''}</b><small>橘子做菜快 20%。</small></div>${kl<3?costBtn('cook',KITCHEN[kl]):'<span class="owned">满级</span>'}</div>`;
  $('side').innerHTML = `<section class="card"><h2>装饰小店</h2><div class="list">${rows}${kitchen}</div></section>`;
}
function renderPalsTab(){
  const p = (img,name,desc,extra='',locked=false)=>`<div class="pal ${locked?'locked':''}"><img src="${IMG(img)}" alt=""><div><b>${name}</b><small>${desc}</small>${extra}</div></div>`;
  const pals = Object.entries(PALS).map(([k,it])=> p(it.img,it.n,it.d, S.pals[k]?'<small class="owned">已经在店里啦</small>':`<div style="margin-top:6px">${costBtn('pal:'+k,it.cost)}</div>`, !S.pals[k])).join('');
  $('side').innerHTML = `<section class="card"><h2>伙伴</h2><div class="list">
    ${p('chibi_boss_smile','橘子','酒馆老板，负责后厨。做菜时会端着托盘笑。')}
    ${p('chibi_lady_wave','宁宁','老板娘，招呼客人，记下每晚的小目标。')}
    ${p('cat_sit','罐罐','店猫，住在藤编窝里。营业时摸一摸，所有等餐的客人多等 6 秒。')}
    ${pals}</div></section>`;
}
function renderTab(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===R.tab));
  ({shop:renderShopTab,menu:renderMenuTab,decor:renderDecorTab,pals:renderPalsTab})[R.tab]();
  $('side').querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ R.tab=t.dataset.tab; renderTab(); }));

function buy(k){
  const [kind,id]=k.split(':');
  let cost, done;
  if(kind==='dish'){ cost=DISH[id].cost; done=()=>{ S.unlocked.push(id); buildDishes(); say('boss','smile',`${DISH[id].n}加进菜单了，今晚就能点。`); }; }
  else if(kind==='decor'){ cost=DECOR[id].cost; done=()=>{ S.decor[id]=true; say('lady','laugh',`${DECOR[id].n}摆好了，店里更暖和了。`); }; }
  else if(kind==='pal'){ cost=PALS[id].cost; done=()=>{ S.pals[id]=true; say('lady','laugh',`${PALS[id].n}来店里上班啦！`); }; }
  else if(kind==='cook'){ cost=KITCHEN[S.cookLv]; done=()=>{ S.cookLv++; say('boss','laugh','换了新灶台，手速更快了！'); }; }
  if(cost==null || S.coins<cost) return;
  S.coins-=cost; done(); save(); applyOwned(); hud(); renderTab();
}

/* ================= guests ================= */
function cookTime(id){ return DISH[id].cook*Math.pow(0.8,S.cookLv); }
function patienceFor(){ let p=Math.max(14,26-Math.min(S.day,10)*1.1); if(S.decor.plant)p+=2; if(S.pals.tangtang)p*=1.15; return p; }
function spawn(){
  const free=[]; for(let i=0;i<tables();i++) if(!R.seats[i]) free.push(i);
  if(!free.length) return;
  const seat=pick(free), sp=pick(Object.keys(GUEST)), G=GUEST[sp];
  const pool=[...S.unlocked];
  if(S.unlocked.includes(G.fav)) pool.push(G.fav,G.fav);
  const sg=R.goals.find(g=>g.kind==='sell'&&g.have<g.need); if(sg) pool.push(sg.dish);
  const dish=pick(pool), max=patienceFor();
  const g={id:++R.uid,seat,sp,dish,max,pat:max,state:'wait'};
  const el=document.createElement('div'); el.className='guest'; el.style.position='relative';
  el.innerHTML=`<button class="hit" type="button" style="position:relative;display:block;width:100%" aria-label="${G.n}"><img src="${IMG(sp+'_sit')}" alt=""></button>
    <div class="bub"><img src="${IMG(dish)}" alt="${DISH[dish].n}">${dish===G.fav?`<img class="fav" src="${IMG('star')}" alt="最爱">`:''}<span class="pat"><i></i></span></div>`;
  el.querySelector('button').addEventListener('click',()=>{ if(g.state==='wait') say(sp,'',`想要一份${DISH[dish].n}。`+(dish===G.fav?'（这是我最爱吃的！）':'')); });
  E.seats[seat].slot.appendChild(el);
  g.el=el; g.bar=el.querySelector('.pat i'); g.bub=el.querySelector('.bub');
  R.seats[seat]=g;
  swap(E.lady,LADY.wave,1500,LADY.idle);
  say(sp,'',pick(G.order).replace('{d}',DISH[dish].n));
  refresh();
}
function removeGuest(g,delay){
  g.state='gone';
  setTimeout(()=>{ g.el.classList.add('leave'); setTimeout(()=>{ g.el.remove(); if(R.seats[g.seat]===g) R.seats[g.seat]=null; refresh(); },500); },delay);
}

/* ================= goals ================= */
function makeGoals(){
  const n=Math.min(4+S.day,12);
  const favs=S.unlocked.filter(id=>Object.values(GUEST).some(G=>G.fav===id));
  const dish=pick(favs.length?favs:S.unlocked);
  const k=Math.min(2+Math.floor(S.day/3),5);
  R.goals=[
    {kind:'serve',img:'service_bell',text:`招待 ${n} 位客人`,need:n,have:0,reward:10+S.day*3},
    {kind:'sell',dish,img:dish,text:`卖出${DISH[dish].n}`,need:k,have:0,reward:8+k*4},
    {kind:'pet',img:'cat_sit',text:'摸摸罐罐',need:1,have:0,reward:5},
  ];
}
function bump(kind,dish){
  R.goals.forEach(g=>{
    if(g.kind!==kind || g.have>=g.need) return;
    if(kind==='sell' && g.dish!==dish) return;
    g.have++;
    if(g.have>=g.need){ S.coins+=g.reward; toast(`<img src="${IMG('star')}" alt="">小目标达成：${g.text} +${g.reward}`); }
  });
}

/* ================= actions ================= */
function order(id){
  if(!R.open){ say('lady','smile','还没开门哦，点「开始营业」就能迎客啦。'); return; }
  const target=R.seats.filter(g=>g&&g.state==='wait'&&g.dish===id).sort((a,b)=>a.pat-b.pat)[0];
  if(!target){ say('lady','sad',`现在没有客人点${DISH[id].n}哦，看看大家头上的小气泡吧。`); return; }
  if(R.queue.length>=3){ swap(E.boss,BOSS.mad,1200,BOSS.idle); say('boss','pout','灶台满啦，一个一个来！'); return; }
  target.state='queued'; target.bub.classList.add('cooking');
  R.queue.push({dish:id,g:target,t:0,need:cookTime(id)});
  refresh();
}
function serve(job){
  const g=job.g, G=GUEST[g.sp], frac=g.pat/g.max, fav=g.dish===G.fav;
  const tip=0.5*frac+(fav?0.5:0)+(S.pals.guoguo?0.15:0)+(S.decor.tree?0.05:0)+Math.min(S.rep,40)*0.01;
  const pay=Math.round(DISH[g.dish].price*(1+tip));
  S.coins+=pay; R.stats.earn+=pay; R.stats.served++; S.served++;
  let rg=frac>0.5?1:0; if(fav)rg++; if(rg&&S.decor.rug)rg++;
  S.rep+=rg;
  R.combo=frac>0.5?R.combo+1:0;
  g.bub.className='bub done'; g.bub.innerHTML=`<img src="${IMG('heart')}" alt="满意">`;
  floatAt(g.el,`<img src="${IMG('orange_coin')}" alt="">+${pay}`);
  bump('serve'); bump('sell',g.dish);
  if(R.combo>=3) say('lady','laugh',`连续 ${R.combo} 位客人都很满意！橘子今晚状态真好。`);
  else say(g.sp,'',fav?G.favLine:pick(G.happy));
  swap(E.lady,LADY.wave,1200,LADY.idle);
  removeGuest(g,1400); save(); hud();
}
function petCat(){
  if(!R.open){ swap(E.cat,'cat_roll',1800,'cat_sleep'); say('lady','smile','罐罐在打盹，营业的时候再来摸它吧。'); return; }
  if(R.catCd>0){ say('lady','smile',`罐罐还想睡一会儿，再等 ${Math.ceil(R.catCd)} 秒吧。`); return; }
  let n=0; R.seats.forEach(g=>{ if(g&&g.state==='wait'){ g.pat=Math.min(g.max,g.pat+6); n++; } });
  R.catCd=25; bump('pet');
  swap(E.cat,'cat_wave',1400,'cat_roll');
  setTimeout(()=>{ if(R.catCd>0) E.cat.querySelector('img').src=IMG('cat_sleep'); },3000);
  say('lady','laugh', n?`罐罐在撒娇，${n} 位客人都看得忘了催单。`:'罐罐翻了个身，没人等餐，它又睡了。');
  if(R.tab==='shop') renderTab();
}

/* ================= loop ================= */
let last=performance.now(), tickUI=0;
function tick(now){
  const dt=Math.min((now-last)/1000,0.1); last=now;
  if(R.open && !document.hidden){
    R.t+=dt;
    if(R.t<DAY_LEN){
      R.spawnIn-=dt;
      if(R.spawnIn<=0){ spawn(); R.spawnIn=Math.max(3,7-Math.min(S.day,8)*0.45-(S.decor.board?1:0))+Math.random()*3; }
    }
    R.seats.forEach(g=>{
      if(!g||g.state!=='wait') return;
      g.pat-=dt;
      const f=Math.max(g.pat/g.max,0);
      g.bar.style.width=(f*100)+'%';
      g.bar.className=f<0.25?'low':f<0.55?'mid':'';
      if(g.pat<=0){
        R.stats.lost++; S.rep=Math.max(0,S.rep-1); R.combo=0;
        floatAt(g.el,`<img src="${IMG('heart')}" alt="">-1`,true);
        g.bub.className='bub done'; g.bub.innerHTML='<span class="gone">走啦</span>';
        swap(E.boss,BOSS.mad,1500,BOSS.idle); swap(E.lady,LADY.sad,1800,LADY.idle);
        say('lady','sad',`${GUEST[g.sp].n}等不及先走了……下次要快一点。`);
        removeGuest(g,600); save(); hud();
      }
    });
    const job=R.queue[0];
    if(job){
      job.t+=dt;
      if(E.boss.dataset.k!=='busy'){ E.boss.dataset.k='busy'; E.boss.src=IMG(BOSS.busy); }
      E.cook.hidden=false; E.cook.querySelector('img').src=IMG(job.dish);
      E.cook.style.setProperty('--p',(Math.min(job.t/job.need,1)*100)+'%');
      if(job.t>=job.need){ R.queue.shift(); serve(job); if(!R.queue.length){ E.cook.hidden=true; E.boss.dataset.k=''; E.boss.src=IMG(BOSS.idle);} refresh(); }
    }
    if(R.catCd>0) R.catCd=Math.max(0,R.catCd-dt);
    const cd=E.cat.querySelector('.catcd'); cd.hidden=!(R.catCd>0); cd.style.setProperty('--p',(R.catCd/25*100)+'%');
    if(R.t>=DAY_LEN && !R.queue.length && !R.seats.some(g=>g&&g.state==='wait')) closeDay();
    else if(R.t>=DAY_LEN && !R.lastCall){ R.lastCall=true; say('boss','smile','到点了，做完手上这几份就打烊。'); }
    tickUI+=dt; if(tickUI>0.25){ tickUI=0; hud(); }
  }
  requestAnimationFrame(tick);
}

/* ================= day flow ================= */
function openDay(){
  R.open=true; R.t=0; R.spawnIn=1.2; R.queue=[]; R.combo=0; R.catCd=0; R.lastCall=false;
  R.stats={earn:0,served:0,lost:0};
  R.seats.forEach(g=>g&&g.el.remove()); R.seats=[];
  makeGoals(); R.tab='shop'; renderTab(); hud();
  say('lady','laugh',S.day===1?'挂牌营业啦！客人头上的气泡就是想吃的菜，点下面的菜品让橘子去做。':`第 ${S.day} 天，开门迎客！今晚的小目标我写好了。`);
  playBgm();
}
function closeDay(){
  R.open=false;
  R.seats.forEach(g=>{ if(g&&g.state!=='gone') removeGuest(g,0); });
  E.cook.hidden=true;
  const st=R.stats, goalsDone=R.goals.filter(g=>g.have>=g.need).length;
  let bonus=0; if(goalsDone===3){ bonus=20+S.day*5; S.coins+=bonus; S.rep+=2; }
  S.day++; save(); hud(); renderTab();
  say(...(st.lost===0&&st.served>0?['lady','laugh','一个客人都没让他们空等，今晚辛苦啦！']:st.lost>st.served?['boss','pout','好多客人没吃上……明天多摸摸罐罐，或者去「装饰」里升级灶台。']:['lady','smile','打烊啦，数数今天的橘子币吧。']));
  modal(`<h2>第 ${S.day-1} 天 · 打烊</h2>
    <div class="sum"><div><b>${st.earn}</b><span>今日收入</span></div><div><b>${st.served}</b><span>招待客人</span></div><div><b>${st.lost}</b><span>没等到的</span></div><div><b>${goalsDone}/3</b><span>小目标</span></div></div>
    <p class="lead">${goalsDone===3?`小目标全部完成，额外奖励 ${bonus} 橘子币和 2 点人气！`:'在「菜单」「装饰」「伙伴」里，可以用橘子币把小店变得更好。'}</p>
    <div class="row"><button class="big" type="button" data-close>回到店里</button></div>`);
}

/* ================= modal ================= */
function modal(html){
  const m=$('modal'), c=$('mcard'); c.innerHTML=html; m.hidden=false;
  c.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{ m.hidden=true; }));
  const f=c.querySelector('button'); f&&f.focus({preventScroll:true});
  return c;
}
function welcome(){
  modal(`<div class="duo"><img src="${IMG('chibi_boss_smile')}" alt="橘子"><img src="${IMG('chibi_lady_wave')}" alt="宁宁"></div>
    <h2>小暖光酒馆</h2>
    <p class="lead">雨夜里，只有橘子和宁宁的小店还亮着灯。<br>客人坐下后，头顶的气泡就是想吃的菜，点下方的菜品，橘子就会开始做。<br>客人等太久会走掉；摸摸窝里的罐罐，大家能多等一会儿。</p>
    <div class="row"><button class="big" type="button" data-close>进店看看</button></div>`);
  S.seen=true; save();
}
function settings(){
  const c=modal(`<h2>设置</h2>
    <div class="toggle"><span>背景音乐 · 小狐狸酒馆</span><button class="buy" type="button" id="bgmT">${S.bgm?'开':'关'}</button></div>
    <p class="lead" style="font-size:13.5px">玩法：客人点单 → 点菜品让橘子制作 → 上菜赚橘子币。完成每晚的三个小目标有额外奖励。</p>
    <div class="row"><button class="ghost" type="button" id="resetBtn">重新开店</button><button class="big" type="button" data-close>好的</button></div>`);
  c.querySelector('#bgmT').addEventListener('click',e=>{ S.bgm=!S.bgm; save(); e.target.textContent=S.bgm?'开':'关'; if(S.bgm) bgm.play().catch(()=>{}); else bgm.pause(); });
  const rb=c.querySelector('#resetBtn');
  rb.addEventListener('click',()=>{
    if(rb.dataset.arm){ S=fresh(); S.seen=true; save(); R.open=false; R.seats.forEach(g=>g&&g.el.remove()); R.seats=[]; R.queue=[]; R.goals=[]; buildScene(); buildDishes(); hud(); renderTab(); $('modal').hidden=true; say('lady','smile','一切从头开始，小店又是新的了。'); }
    else { rb.dataset.arm='1'; rb.textContent='再点一次确认清空'; setTimeout(()=>{ if(rb.isConnected){ delete rb.dataset.arm; rb.textContent='重新开店'; } },3000); }
  });
}
$('gearBtn').addEventListener('click',settings);
$('startBtn').addEventListener('click',()=>{ if(!R.open) openDay(); });

/* ================= bgm ================= */
const bgm=$('bgm'); bgm.volume=0.45;
function playBgm(){ if(S.bgm) bgm.play().catch(()=>{}); }

/* ================= boot ================= */
function start(data){
  if(data && data.S) S=data.S;
  buildScene(); buildDishes(); hud(); renderTab();
  say('lady','smile',S.day===1?'欢迎来到小暖光酒馆！准备好了就点「开始营业」。':`欢迎回来！今天是第 ${S.day} 天，准备好就开门吧。`);
  if(!S.seen) welcome();
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(tick); });
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({S}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});
})();
</script>
